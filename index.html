<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>26个英文字母 · 大小写与发音</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1f2937;
    background:
      radial-gradient(1200px 600px at 10% -10%, #e0eaff 0%, transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, #ffe6f2 0%, transparent 55%),
      radial-gradient(900px 600px at 50% 110%, #dff7ee 0%, transparent 60%),
      #f8fafc;
    min-height:100vh;
    padding:32px 18px 64px;
  }

  /* ---------- 视图切换 ---------- */
  .view{display:none}
  .view.active{display:block;animation:fadeUp .35s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ---------- 首页 ---------- */
  .hero-head{text-align:center;margin-bottom:30px}
  .hero-head h1{
    margin:0 0 10px;
    font-size:clamp(24px,5vw,38px);
    letter-spacing:1px;
    background:linear-gradient(90deg,#4f46e5,#db2777,#0d9488);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-head p{margin:0;color:#64748b;font-size:clamp(13px,2.6vw,16px)}
  .foot{text-align:center;color:#94a3b8;font-size:12.5px;margin-top:34px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
    gap:14px;
    max-width:940px;
    margin:0 auto;
  }
  .letter-card{
    --h:220;
    aspect-ratio:1/1;
    border:0;padding:0;cursor:pointer;
    font-family:inherit;
    border-radius:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:linear-gradient(160deg,hsl(var(--h) 100% 97%),hsl(var(--h) 85% 88%));
    color:hsl(var(--h) 62% 32%);
    box-shadow:0 6px 16px hsl(var(--h) 60% 60% / .18), inset 0 0 0 2px hsl(var(--h) 100% 100% / .7);
    transition:transform .16s ease, box-shadow .16s ease;
    animation:pop .42s cubic-bezier(.2,.8,.3,1.2) backwards;
    animation-delay:calc(var(--i) * 22ms);
  }
  @keyframes pop{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
  .letter-card:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 14px 26px hsl(var(--h) 60% 55% / .28)}
  .letter-card:active{transform:scale(.96)}
  .letter-card .pair{display:flex;align-items:baseline;gap:2px;line-height:1}
  .letter-card .pair b{font-size:clamp(26px,5.4vw,34px);font-weight:800}
  .letter-card .pair i{font-style:normal;font-size:clamp(22px,4.6vw,29px);font-weight:700;opacity:.5}
  .letter-card .ip{font-size:12px;font-weight:600;opacity:.65;letter-spacing:.4px}

  /* ---------- 详情页 ---------- */
  .back{
    display:block;margin:0 auto 18px;
    padding:10px 20px;border:0;border-radius:999px;cursor:pointer;
    background:#fff;color:#475569;font-family:inherit;font-weight:700;font-size:14px;
    box-shadow:0 4px 14px rgba(15,23,42,.09);
    transition:.15s;
  }
  .back:hover{transform:translateX(-2px);color:#1e293b}

  .detail-card{
    --h:220;
    max-width:760px;margin:0 auto;
    background:#fff;
    border-radius:32px;
    padding:26px 22px 22px;
    border:2px solid hsl(var(--h) 90% 92%);
    box-shadow:0 22px 55px hsl(var(--h) 60% 50% / .16);
    animation:pop .32s cubic-bezier(.2,.8,.3,1.2) both;
  }

  .d-hero{text-align:center}
  .d-letters{display:flex;justify-content:center;gap:16px}
  .d-letters > span{
    display:inline-flex;align-items:center;justify-content:center;
    width:clamp(88px,21vw,124px);height:clamp(88px,21vw,124px);
    border-radius:26px;
    font-size:clamp(52px,12vw,76px);
    font-weight:800;line-height:1;
    color:hsl(var(--h) 68% 45%);
    background:hsl(var(--h) 100% 96.5%);
    border:2px solid hsl(var(--h) 85% 90%);
  }
  .d-letters .low{opacity:.55}
  .d-sub{color:#94a3b8;font-size:13px;font-weight:600;margin-top:12px;letter-spacing:.6px}

  .audio-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 0}
  @media (max-width:480px){.audio-row{grid-template-columns:1fr}}

  .audio-btn{
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;border:0;border-radius:18px;cursor:pointer;
    font-family:inherit;text-align:left;
    background:hsl(var(--h) 100% 96%);
    color:hsl(var(--h) 62% 32%);
    box-shadow:inset 0 0 0 2px hsl(var(--h) 80% 90%);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .audio-btn:hover{background:hsl(var(--h) 100% 92.5%);transform:translateY(-2px)}
  .audio-btn:active{transform:scale(.97)}
  .audio-btn .ico{font-size:23px;line-height:1}
  .audio-btn .txt{display:flex;flex-direction:column;gap:3px;line-height:1.15}
  .audio-btn .txt b{font-size:12.5px;font-weight:700;opacity:.8}
  .audio-btn .txt em{font-style:normal;font-size:17.5px;font-weight:800;letter-spacing:.6px}

  .hint{
    font-size:13px;color:#64748b;line-height:1.65;
    background:#f8fafc;border:1px dashed #e2e8f0;
    border-radius:14px;padding:10px 14px;margin:16px 0 0;
  }
  .hint b{color:#334155}

  .sec-title{
    position:relative;
    font-size:15px;font-weight:800;color:#334155;
    margin:24px 0 12px;padding-left:13px;letter-spacing:.6px;
  }
  .sec-title::before{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:4px;height:16px;border-radius:3px;background:hsl(var(--h) 75% 58%);
  }

  .word-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .word-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 16px;border-radius:16px;cursor:pointer;
    background:#f8fafc;border:1px solid #eef2f7;
    transition:.15s;
  }
  .word-item:hover{
    background:hsl(var(--h) 100% 97.5%);
    border-color:hsl(var(--h) 80% 88%);
    transform:translateX(4px);
  }
  .word-item .emoji{font-size:25px;width:32px;text-align:center;line-height:1}
  .word-item .w-en{font-size:19px;font-weight:800;color:#111827;letter-spacing:.2px}
  .word-item .w-en mark{
    background:hsl(var(--h) 95% 86%);
    color:hsl(var(--h) 70% 30%);
    border-radius:5px;padding:0 2px;
  }
  .word-item .w-zh{flex:1;text-align:right;color:#94a3b8;font-size:14px;font-weight:600}
  .word-item .spk{font-size:17px;opacity:.45;transition:opacity .15s}
  .word-item:hover .spk{opacity:.9}

  .nav-row{display:flex;gap:12px;margin-top:24px}
  .nav-row button{
    flex:1;padding:13px 10px;border:0;border-radius:16px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:800;
    background:#f1f5f9;color:#334155;
    transition:.15s;
  }
  .nav-row button:hover:not(:disabled){background:#e2e8f0;transform:translateY(-2px)}
  .nav-row button:disabled{opacity:.32;cursor:not-allowed}

  .playing{
    animation:tap .45s ease;
    box-shadow:0 0 0 5px hsl(var(--h) 90% 84%) !important;
  }
  @keyframes tap{0%{transform:scale(1)}40%{transform:scale(.95)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="page">
  <!-- 首页 -->
  <section id="view-home" class="view active">
    <header class="hero-head">
      <h1>26 个英文字母</h1>
      <p>点击任意字母，学习「大小写 · 音标发音 · 常见单词」</p>
    </header>
    <div class="grid" id="grid"></div>
    <p class="foot">🔊 请开启设备声音 · 建议使用 Chrome / Edge / Safari</p>
  </section>

  <!-- 详情页 -->
  <section id="view-detail" class="view">
    <button class="back" id="backBtn">← 返回字母表</button>
    <div class="detail-card" id="detailCard"></div>
  </section>
</div>

<script>
/* ================== 数据 ================== */
const LETTERS = [
  {ch:'A', nameIpa:'/eɪ/',  soundIpa:'/æ/',  words:[
    {w:'apple',    zh:'苹果',   emoji:'🍎'},
    {w:'ant',      zh:'蚂蚁',   emoji:'🐜'},
    {w:'airplane', zh:'飞机',   emoji:'✈️'}]},
  {ch:'B', nameIpa:'/biː/', soundIpa:'/b/',  words:[
    {w:'ball',  zh:'球',    emoji:'⚽'},
    {w:'bear',  zh:'熊',    emoji:'🐻'},
    {w:'book',  zh:'书',    emoji:'📖'}]},
  {ch:'C', nameIpa:'/siː/', soundIpa:'/k/',  words:[
    {w:'cat',  zh:'猫',     emoji:'🐱'},
    {w:'car',  zh:'汽车',   emoji:'🚗'},
    {w:'cake', zh:'蛋糕',   emoji:'🎂'}]},
  {ch:'D', nameIpa:'/diː/', soundIpa:'/d/',  words:[
    {w:'dog',  zh:'狗',     emoji:'🐶'},
    {w:'duck', zh:'鸭子',   emoji:'🦆'},
    {w:'door', zh:'门',     emoji:'🚪'}]},
  {ch:'E', nameIpa:'/iː/',  soundIpa:'/e/',  words:[
    {w:'egg',      zh:'鸡蛋', emoji:'🥚'},
    {w:'elephant', zh:'大象', emoji:'🐘'},
    {w:'eleven',   zh:'十一', emoji:'🔢'}]},
  {ch:'F', nameIpa:'/ef/',  soundIpa:'/f/',  words:[
    {w:'fish', zh:'鱼',     emoji:'🐟'},
    {w:'fox',  zh:'狐狸',   emoji:'🦊'},
    {w:'frog', zh:'青蛙',   emoji:'🐸'}]},
  {ch:'G', nameIpa:'/dʒiː/',soundIpa:'/g/',  words:[
    {w:'goat',   zh:'山羊', emoji:'🐐'},
    {w:'grapes', zh:'葡萄', emoji:'🍇'},
    {w:'girl',   zh:'女孩', emoji:'👧'}]},
  {ch:'H', nameIpa:'/eɪtʃ/',soundIpa:'/h/',  words:[
    {w:'hat',   zh:'帽子', emoji:'🎩'},
    {w:'horse', zh:'马',   emoji:'🐴'},
    {w:'house', zh:'房子', emoji:'🏠'}]},
  {ch:'I', nameIpa:'/aɪ/',  soundIpa:'/ɪ/',  words:[
    {w:'ink',    zh:'墨水', emoji:'🖋️'},
    {w:'insect', zh:'昆虫', emoji:'🐛'},
    {w:'igloo',  zh:'冰屋', emoji:'🧊'}]},
  {ch:'J', nameIpa:'/dʒeɪ/',soundIpa:'/dʒ/', words:[
    {w:'juice',  zh:'果汁', emoji:'🧃'},
    {w:'jam',    zh:'果酱', emoji:'🍯'},
    {w:'jacket', zh:'夹克', emoji:'🧥'}]},
  {ch:'K', nameIpa:'/keɪ/', soundIpa:'/k/',  words:[
    {w:'kite', zh:'风筝', emoji:'🪁'},
    {w:'key',  zh:'钥匙', emoji:'🔑'},
    {w:'king', zh:'国王', emoji:'👑'}]},
  {ch:'L', nameIpa:'/el/',  soundIpa:'/l/',  words:[
    {w:'lion', zh:'狮子', emoji:'🦁'},
    {w:'leaf', zh:'树叶', emoji:'🍃'},
    {w:'leg',  zh:'腿',   emoji:'🦵'}]},
  {ch:'M', nameIpa:'/em/',  soundIpa:'/m/',  words:[
    {w:'moon',   zh:'月亮', emoji:'🌙'},
    {w:'milk',   zh:'牛奶', emoji:'🥛'},
    {w:'monkey', zh:'猴子', emoji:'🐵'}]},
  {ch:'N', nameIpa:'/en/',  soundIpa:'/n/',  words:[
    {w:'nose',      zh:'鼻子', emoji:'👃'},
    {w:'newspaper', zh:'报纸', emoji:'📰'},
    {w:'net',       zh:'网',   emoji:'🥅'}]},
  {ch:'O', nameIpa:'/əʊ/',  soundIpa:'/ɒ/',  words:[
    {w:'orange',  zh:'橙子', emoji:'🍊'},
    {w:'octopus', zh:'章鱼', emoji:'🐙'},
    {w:'ox',      zh:'公牛', emoji:'🐂'}]},
  {ch:'P', nameIpa:'/piː/', soundIpa:'/p/',  words:[
    {w:'pig',  zh:'猪',   emoji:'🐷'},
    {w:'pen',  zh:'钢笔', emoji:'🖊️'},
    {w:'pear', zh:'梨',   emoji:'🍐'}]},
  {ch:'Q', nameIpa:'/kjuː/',soundIpa:'/kw/', words:[
    {w:'queen',    zh:'女王', emoji:'👑'},
    {w:'question', zh:'问题', emoji:'❓'},
    {w:'quilt',    zh:'被子', emoji:'🛌'}]},
  {ch:'R', nameIpa:'/ɑː/',  soundIpa:'/r/',  words:[
    {w:'rabbit', zh:'兔子',   emoji:'🐰'},
    {w:'rain',   zh:'雨',     emoji:'🌧️'},
    {w:'robot',  zh:'机器人', emoji:'🤖'}]},
  {ch:'S', nameIpa:'/es/',  soundIpa:'/s/',  words:[
    {w:'sun',   zh:'太阳', emoji:'☀️'},
    {w:'snake', zh:'蛇',   emoji:'🐍'},
    {w:'star',  zh:'星星', emoji:'⭐'}]},
  {ch:'T', nameIpa:'/tiː/', soundIpa:'/t/',  words:[
    {w:'tiger', zh:'老虎', emoji:'🐯'},
    {w:'tree',  zh:'树',   emoji:'🌳'},
    {w:'train', zh:'火车', emoji:'🚂'}]},
  {ch:'U', nameIpa:'/juː/', soundIpa:'/ʌ/',  words:[
    {w:'umbrella', zh:'雨伞', emoji:'☂️'},
    {w:'up',       zh:'向上', emoji:'⬆️'},
    {w:'uncle',    zh:'叔叔', emoji:'👨'}]},
  {ch:'V', nameIpa:'/viː/', soundIpa:'/v/',  words:[
    {w:'van',    zh:'面包车', emoji:'🚐'},
    {w:'violin', zh:'小提琴', emoji:'🎻'},
    {w:'vest',   zh:'背心',   emoji:'🦺'}]},
  {ch:'W', nameIpa:'/ˈdʌbljuː/', soundIpa:'/w/', words:[
    {w:'water',  zh:'水',   emoji:'💧'},
    {w:'window', zh:'窗户', emoji:'🪟'},
    {w:'watch',  zh:'手表', emoji:'⌚'}]},
  {ch:'X', nameIpa:'/eks/', soundIpa:'/ks/', words:[
    {w:'box', zh:'盒子', emoji:'📦'},
    {w:'fox', zh:'狐狸', emoji:'🦊'},
    {w:'six', zh:'六',   emoji:'6️⃣'}]},
  {ch:'Y', nameIpa:'/waɪ/', soundIpa:'/j/',  words:[
    {w:'yellow', zh:'黄色',   emoji:'💛'},
    {w:'yoyo',   zh:'悠悠球', emoji:'🪀'},
    {w:'yes',    zh:'是的',   emoji:'✅'}]},
  {ch:'Z', nameIpa:'/zed/', soundIpa:'/z/',  words:[
    {w:'zebra', zh:'斑马',   emoji:'🦓'},
    {w:'zoo',   zh:'动物园', emoji:'🐘'},
    {w:'zero',  zh:'零',     emoji:'0️⃣'}]}
];

/* ================== 语音 ================== */
const synth = window.speechSynthesis;
let enVoice = null;

function refreshVoices(){
  if(!synth) return;
  const vs = synth.getVoices();
  if(!vs.length) return;
  enVoice = vs.find(v=>/^en[-_]GB/i.test(v.lang))
         || vs.find(v=>/^en[-_]US/i.test(v.lang))
         || vs.find(v=>/^en/i.test(v.lang))
         || null;
}
if(synth){ refreshVoices(); synth.onvoiceschanged = refreshVoices; }

function speak(text, rate){
  if(!synth){
    alert('当前浏览器不支持语音朗读，建议使用 Chrome / Edge / Safari。');
    return;
  }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (enVoice && enVoice.lang) || 'en-GB';
  if(enVoice) u.voice = enVoice;
  u.rate = rate || 0.85;
  u.pitch = 1;
  synth.speak(u);
}

/* ================== 元素 ================== */
const grid       = document.getElementById('grid');
const detailCard = document.getElementById('detailCard');
const viewHome   = document.getElementById('view-home');
const viewDetail = document.getElementById('view-detail');
const backBtn    = document.getElementById('backBtn');

let current = 0;

/* ================== 首页渲染 ================== */
grid.innerHTML = LETTERS.map((L, i) => {
  const h = Math.round(i * 360 / LETTERS.length + 8) % 360;
  return `<button class="letter-card" data-i="${i}" style="--h:${h};--i:${i}"
            aria-label="字母 ${L.ch}">
    <span class="pair"><b>${L.ch}</b><i>${L.ch.toLowerCase()}</i></span>
    <span class="ip">${L.nameIpa}</span>
  </button>`;
}).join('');

grid.addEventListener('click', e => {
  const card = e.target.closest('.letter-card');
  if(!card) return;
  openDetail(Number(card.dataset.i));
});

/* ================== 详情渲染 ================== */
function highlight(word, ch){
  const idx = word.toLowerCase().indexOf(ch.toLowerCase());
  if(idx < 0) return word;
  return word.slice(0, idx) + '<mark>' + word[idx] + '</mark>' + word.slice(idx + 1);
}

function renderDetail(i){
  const L = LETTERS[i];
  const h = Math.round(i * 360 / LETTERS.length + 8) % 360;
  detailCard.style.setProperty('--h', h);
  const first = L.words[0].w;

  detailCard.innerHTML = `
    <div class="d-hero">
      <div class="d-letters">
        <span class="up">${L.ch}</span>
        <span class="low">${L.ch.toLowerCase()}</span>
      </div>
      <div class="d-sub">第 ${i + 1} / ${LETTERS.length} 个字母</div>
    </div>

    <div class="audio-row">
      <button class="audio-btn" data-type="name">
        <span class="ico">🔊</span>
        <span class="txt">
          <b>字母名称 Letter Name</b>
          <em>${L.nameIpa}</em>
        </span>
      </button>
      <button class="audio-btn" data-type="sound">
        <span class="ico">🗣️</span>
        <span class="txt">
          <b>字母发音 Letter Sound</b>
          <em>${L.soundIpa}</em>
        </span>
      </button>
    </div>

    <p class="hint">
      💡 <b>名称</b>是唱字母歌时读的音；<b>发音</b>是它在单词里的常见音，点击它会朗读例词 <b>${first}</b>。
    </p>

    <h2 class="sec-title">常见单词</h2>
    <ul class="word-list">
      ${L.words.map(w => `
        <li class="word-item" data-word="${w.w}">
          <span class="emoji">${w.emoji}</span>
          <span class="w-en">${highlight(w.w, L.ch)}</span>
          <span class="w-zh">${w.zh}</span>
          <span class="spk">🔊</span>
        </li>`).join('')}
    </ul>

    <div class="nav-row">
      <button id="prevBtn" ${i === 0 ? 'disabled' : ''}>
        ← ${i > 0 ? LETTERS[i - 1].ch : '—'}
      </button>
      <button id="nextBtn" ${i === LETTERS.length - 1 ? 'disabled' : ''}>
        ${i < LETTERS.length - 1 ? LETTERS[i + 1].ch : '—'} →
      </button>
    </div>
  `;
}

function openDetail(i){
  current = i;
  renderDetail(i);
  viewHome.classList.remove('active');
  viewDetail.classList.add('active');
  window.scrollTo(0, 0);
}

function goHome(){
  viewDetail.classList.remove('active');
  viewHome.classList.add('active');
  if(synth) synth.cancel();
  window.scrollTo(0, 0);
}

function pulse(el){
  el.classList.add('playing');
  setTimeout(() => el.classList.remove('playing'), 460);
}

/* ================== 事件 ================== */
backBtn.addEventListener('click', goHome);

detailCard.addEventListener('click', e => {
  const audioBtn = e.target.closest('.audio-btn');
  if(audioBtn){
    const L = LETTERS[current];
    if(audioBtn.dataset.type === 'name'){
      speak(L.ch, 0.8);              // 字母名称
    }else{
      speak(L.words[0].w, 0.72);     // 字母发音 → 用首例词示范
    }
    pulse(audioBtn);
    return;
  }

  const wordItem = e.target.closest('.word-item');
  if(wordItem){
    speak(wordItem.dataset.word, 0.85);
    pulse(wordItem);
    return;
  }

  if(e.target.closest('#prevBtn') && current > 0){
    openDetail(current - 1);
    return;
  }
  if(e.target.closest('#nextBtn') && current < LETTERS.length - 1){
    openDetail(current + 1);
  }
});

document.addEventListener('keydown', e => {
  if(!viewDetail.classList.contains('active')) return;
  if(e.key === 'Escape') goHome();
  if(e.key === 'ArrowLeft'  && current > 0) openDetail(current - 1);
  if(e.key === 'ArrowRight' && current < LETTERS.length - 1) openDetail(current + 1);
});
</script>
</body>
</html>
